services:
  - type: web
    name: chasquifly-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DUFFEL_ENABLED
        value: "false"
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://chasquifly.vercel.app,http://localhost:5173
